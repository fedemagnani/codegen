[package]
name = "codegen-macros"
version = "0.1.0"
edition = "2024"
description = "The `#[codegen::probe]` attribute, re-exported by the codegen crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fedemagnani/codegen"

[lib]
proc-macro = true

[features]
# expands the attributes; without it `probe` removes its item and `watch` leaves its `fn` as written
enabled = []
