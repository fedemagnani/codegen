[package]
name = "codegen-probe"
version = "0.1.2"
edition = "2024"
description = "Probes for assembly-aware analysis: never-inlined wrappers of a crate's API, compiled as its users compile them"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fedemagnani/codegen"

[lib]
# imported as `codegen` under its package name, as the attributes expand to `::codegen::`
name = "codegen"

[features]
# turns the attributes and `probes!` on; `cargo codegen` enables it, so a crate never does
enabled = ["codegen-macros/enabled"]

[dependencies]
# `#[codegen::probe]`, re-exported as `probe`
codegen-macros = { version = "0.1.2", path = "../codegen-macros" }
